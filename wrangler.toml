# ── GitHub Actions 部署（推荐）─────────────────────────────
# 已配置 .github/workflows/deploy.yml：推送到 main 时自动构建并部署到
# Cloudflare Pages。需要在仓库里配置两个 Secrets：
#
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens
#                           权限：Account / Cloudflare Pages / Edit
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare 控制台右侧栏的 Account ID
#
# 配置位置：仓库 Settings → Secrets and variables → Actions
#
# ── 怎么手动发布（备选，仍可用）────────────────────────────
# 在**项目根目录**（也就是本文件所在目录）执行：
#
#   首次：
#     npx wrangler login                       # 浏览器登录 Cloudflare 账号
#     npx wrangler pages project create sasaorange-novel   # 项目不存在时才需要
#
#   之后每次发布：
#     pnpm docs:build                          # 生成 docs/.vitepress/dist
#     npx wrangler pages deploy                # 读取本文件，把 dist 传上去
#
#   或者一条命令搞定（= 上面两步）：
#     pnpm docs:deploy
#
# 构建产物（docs/.vitepress/dist）在 .gitignore 里，所以必须先构建再上传；
# 想先在本机确认效果就用 pnpm docs:preview。
#
# ── 另一种做法：连 Git 仓库自动构建 ──────────────────────────
# 在 Cloudflare 控制台新建 Pages 项目并连上这个仓库，填：
#   构建命令：pnpm docs:build
#   输出目录：docs/.vitepress/dist
# 注意：若同时启用了本仓库的 GitHub Actions，会造成重复部署，二选一即可。

# 项目名，同时决定默认域名 <name>.pages.dev
# 首次部署会用它创建/关联项目，之后**不能改名**（要换只能重建项目），所以先想好。
name = "sasaorange-novel"

# 构建产物目录，相对本文件所在位置。改这里的话上面命令里的路径也要跟着改。
pages_build_output_dir = "docs/.vitepress/dist"

# 兼容日期：决定 Workers 运行时 API 的默认行为。
# 这个站点是纯静态资源、没有 Functions，写部署当天的日期即可。
compatibility_date = "2026-10-14"
